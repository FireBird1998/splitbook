name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Next.js app lives in apps/web, so app steps run there; the workspace-wide
# scripts (lint, typecheck, test) run at the root so packages/* are covered too.
# pnpm's version comes from the packageManager field in the root package.json
# and Node's from .nvmrc; `pnpm install` inside apps/web installs the workspace.
jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (workspace)
        working-directory: .
        run: pnpm lint

      - name: Adopted design-system style policy
        run: pnpm check:design-system

      - name: Test (workspace, unit + integration)
        working-directory: .
        run: pnpm test
        env:
          # Integration suites derive per-file splitbook-test-* databases from
          # this base URI; the demo database is never touched.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true

      - name: Typecheck (workspace)
        working-directory: .
        run: pnpm typecheck

      - name: Install Chromium for authenticated browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated expense access (isolated app and database)
        run: pnpm test:expense-access

      - name: Google sign-in recovery (isolated app and database)
        run: pnpm exec playwright test --config playwright.auth-recovery.config.ts

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: test
          MONGODB_URI: mongodb://127.0.0.1:27017/splitbook-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_GOOGLE_ID: test
          AUTH_GOOGLE_SECRET: test

  playwright:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: test
          MONGODB_URI: mongodb://127.0.0.1:27017/splitbook-build
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          AUTH_GOOGLE_ID: test
          AUTH_GOOGLE_SECRET: test

      - name: Run browser journeys (demo mode, seeded)
        run: pnpm test:e2e

      - name: Run Google OAuth journeys (google mode, intercepted redirect and ID-token sign-in)
        run: pnpm test:e2e:google

      - name: Start reproducible Linux visual-test browser
        run: |
          docker run --name splitbook-design-browser --platform linux/amd64 --rm -d --init \
            --ipc=host -p 127.0.0.1:9323:9323 \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            /bin/sh -c 'npx -y playwright@1.62.1 run-server --port 9323 --host 0.0.0.0'
          for attempt in $(seq 1 30); do
            if docker logs splitbook-design-browser 2>&1 | grep -Fq 'Listening on'; then exit 0; fi
            sleep 1
          done
          docker logs splitbook-design-browser
          exit 1

      - name: Component lab (no auth or database dependencies)
        run: pnpm test:design-system
        env:
          DESIGN_BROWSER_WS: ws://127.0.0.1:9323/

      - name: Pilot behavior, accessibility, and visual comparisons
        run: pnpm test:pilot
        env:
          DESIGN_BROWSER_WS: ws://127.0.0.1:9323/

      - name: Production lab exclusion
        run: pnpm test:production-ui

      - name: Stop visual-test browser
        if: always()
        run: docker stop splitbook-design-browser

      - name: Upload Playwright report and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright*/report/
            apps/web/playwright*/results/
            apps/web/playwright*/artifacts/
            apps/web/output/playwright/
          retention-days: 7
