name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: test
          MONGODB_URI: mongodb://127.0.0.1:27017/split-test
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_GOOGLE_ID: test
          AUTH_GOOGLE_SECRET: test
