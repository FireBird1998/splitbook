name: CI

# What runs where (#277). Private-repository minutes are a monthly quota, and every branch
# runs `pnpm swarm gate` before it is pushed, so pull-request CI is a fast safety net and the
# slow, broad jobs run less often:
#
# - PR checks (pr-checks) runs on every event: lint, typecheck, format check, the
#   design-system style policy, the workspace unit tests in UTC and every mobile HTTP
#   verifier, in one job that installs once. It is the one check branch protection requires,
#   so its name, "PR checks", must not change. A pull request that changes only Markdown,
#   docs/ or .claude/ files runs just the format check, and the check still passes.
# - On a pull request, PR checks ends with the ceilings ratchet (#206): no render or request
#   ceiling may rise, and no journey may be removed or renamed, unless the pull request has
#   the re-record-ceilings label and an approver applied it last. Approvers are the logins in
#   the repository variable CEILINGS_APPROVERS, which only an admin can set, or the
#   repository owner without it. Adding or removing any label reruns PR checks, so an
#   approver's label turns a failing check green; lowering a ceiling never needs it.
# - Every label event reruns all of PR checks, even for labels nothing reads. Keep it that
#   way: a skipped required check counts as passing, so skipping PR checks on other label
#   events could turn a red commit green.
# - Each push to main runs PR checks only, on the merged result. So does each push to
#   pilot/tanstack-reads, the integration branch of ADR 0006's TanStack pilot (#214 to #217),
#   so merging main into it is checked too. A pull request into that branch runs PR checks,
#   ratchet included, as one into main does: pull_request has no branch filter.
# - The full suite (verify, playwright and the unit-test time-zone matrix) runs nightly, on a
#   manual run (workflow_dispatch), and on a pull request labelled full-ci, never on a push.
#   A nightly run is skipped when main's commit already passed the full suite in an earlier
#   nightly or manual run.
# - A new push to a pull request, or to a pushed branch, cancels that pull request's or
#   branch's run of the push before it. Nightly and manual runs are never cancelled.
#
# GitHub e-mails a failed push run to whoever pushed it, and a failed nightly run to whoever
# last changed the cron line below, so the owner merges changes to that line;
# tools/swarm/README.md says more.
on:
  pull_request:
    # labeled starts the full suite when full-ci is added; any other label, and removing any
    # label (unlabeled), only reruns PR checks, whose ceilings ratchet reads the
    # re-record-ceilings label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, pilot/tanstack-reads]
  schedule:
    # 04:17 UTC (09:47 in India): the quietest hour of the repository's runs, after the evening
    # merges, and off the top of the hour, when GitHub delays scheduled runs the most.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request, and one per pushed branch (main, pilot/tanstack-reads), so a new
# push cancels the run it supersedes: on a branch that run is PR checks only, and the newer
# commit is tested anyway.
# Adding a label other than full-ci, or removing any label, gets a group of its own: it must
# not cancel a full-ci run in progress. Nightly and manual runs each get a group of their own,
# so none is cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.action == 'labeled' && github.event.label.name == 'full-ci') && format('pr-{0}', github.event.pull_request.number) ||
    github.event_name == 'push' && format('push-{0}', github.ref) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The Next.js app lives in apps/web, so app steps run there; the workspace-wide
# scripts (lint, typecheck, test) run at the root so packages/* are covered too.
# pnpm's version comes from the packageManager field in the root package.json
# and Node's from .nvmrc; `pnpm install` inside apps/web installs the workspace.
jobs:
  # A nightly run that would test a commit this workflow has already passed adds nothing.
  # Every job below waits for this one; it runs only on the schedule.
  nightly-gate:
    name: Nightly gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      # A successful earlier nightly or manual run means every job, the full suite included,
      # passed on this commit. A push run doesn't count: it runs PR checks only. If GitHub
      # can't be asked, the nightly run goes ahead.
      - name: Skip when main's commit already passed the full suite
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          query="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&status=success&per_page=100"
          filter='[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length'
          if passed=$(gh api "$query" --jq "$filter"); then
            if [ "${passed:-0}" -gt 0 ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Nightly run skipped::$GITHUB_SHA already passed the full suite in $passed earlier run(s)."
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "$GITHUB_SHA has no successful full run yet, so this nightly run tests it."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nightly gate::Could not list this workflow's runs, so this nightly run tests $GITHUB_SHA anyway."
          fi

  # verify, unit-time-zones and playwright are the full suite. Each repeats one condition:
  # a nightly run the gate let through; a manual run; or a pull request labelled full-ci,
  # when the label is added and on each push after that (adding another label, or removing
  # any label, doesn't rerun them). A push, to main or pilot/tanstack-reads, never runs them.
  verify:
    needs: nightly-gate
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true') ||
        (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci') &&
          (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
            github.event.action == 'labeled' && github.event.label.name == 'full-ci'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: apps/web

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (workspace)
        working-directory: .
        run: pnpm lint

      - name: Adopted design-system style policy
        run: pnpm check:design-system

      - name: Test (workspace, unit + integration)
        working-directory: .
        run: pnpm test
        env:
          # Integration suites derive per-file splitbook-test-* databases from
          # this base URI; the demo database is never touched.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true

      - name: Typecheck (workspace)
        working-directory: .
        run: pnpm typecheck

      - name: Install Chromium for authenticated browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated expense access (isolated app and database)
        run: pnpm test:expense-access

      - name: Google sign-in recovery (isolated app and database)
        run: pnpm exec playwright test --config playwright.auth-recovery.config.ts

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: test
          MONGODB_URI: mongodb://127.0.0.1:27017/splitbook-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_GOOGLE_ID: test
          AUTH_GOOGLE_SECRET: test

      - name: Upload authenticated test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-test-failures
          path: |
            apps/web/output/playwright/expense-access/
            apps/web/output/playwright/auth-recovery/
          retention-days: 7

  # Unit tests give the same result in every time zone (#227). PR checks and verify run
  # them in UTC; this matrix repeats them on both sides of the date line. None of these
  # zones observes daylight saving time, so each offset holds all year.
  unit-time-zones:
    name: Unit tests (${{ matrix.tz }})
    needs: nightly-gate
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true') ||
        (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci') &&
          (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
            github.event.action == 'labeled' && github.event.label.name == 'full-ci'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        tz:
          - Pacific/Tongatapu # UTC+13
          - Pacific/Kiritimati # UTC+14
          - Pacific/Pago_Pago # UTC-11

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests in ${{ matrix.tz }} (workspace)
        run: pnpm test:unit
        env:
          TZ: ${{ matrix.tz }}

  # PR checks is the one check branch protection requires: keep its name. It runs on every
  # event, so each push to main or pilot/tanstack-reads is checked merged, and the nightly run
  # gets it too (nothing else formats or runs the verifiers).
  #
  # The mobile verify:* scripts drive the real mobile controller over HTTP against a
  # fictional backend of this run's own (#228). tools/swarm starts it on the job's Mongo
  # service, with a fresh splitbook_mobile_swarm_* database and the fictional seed, and
  # serves a production build, so no route compiles while a verifier waits. verify:all
  # runs every verifier one after another, never two at once: several assume they are
  # the only ones using Sam on their backend. Their order doesn't matter.
  pr-checks:
    name: PR checks
    needs: nightly-gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job's permissions replace the workflow's, so contents: read is repeated. The ceilings
    # step, the last, reads the pull request's timeline, which needs pull-requests: read;
    # nothing writes.
    permissions:
      contents: read
      pull-requests: read

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out merged into its base; depth 2 brings the base too.
          fetch-depth: 2

      # The merge commit's first parent is the base, so this lists what merging would change.
      # --no-renames lists a moved file under both names, so moving code into docs/ counts as
      # a code change. Anything unexpected leaves docs_only false, and every check runs.
      - name: Find what this pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          docs_only=false
          if git rev-parse --verify --quiet 'HEAD^2' > /dev/null && changed=$(git diff --name-only --no-renames 'HEAD^1' HEAD); then
            printf 'Changed files:\n%s\n' "$changed"
            docs_only=true
            while IFS= read -r path; do
              case "$path" in
                docs/* | .claude/* | *.md) ;;
                *) docs_only=false ;;
              esac
            done <<< "$changed"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "::notice title=Docs-only pull request::Only Markdown, docs/ or .claude/ files changed, so PR checks runs the format check only."
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prettier formats Markdown and the docs/ mockups too, so docs-only changes run it.
      - name: Format check (workspace)
        run: pnpm format:check

      - name: Lint (workspace)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint

      - name: Typecheck (workspace)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm typecheck

      - name: Adopted design-system style policy
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm web check:design-system

      - name: Unit tests in UTC (workspace)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm test:unit
        env:
          TZ: UTC

      # up prints MOBILE_VERIFY_URL and the backend's SPLITBOOK_NATIVE_* variables as
      # NAME=value lines; the later steps get them through GITHUB_ENV.
      - name: Start this run's backend (tools/swarm, production build)
        id: backend
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        timeout-minutes: 15
        run: |
          pnpm swarm up --mongo-port 27017 --server production --ready-timeout 600 | tee "$RUNNER_TEMP/swarm-up.log"
          grep -E '^(MOBILE_VERIFY_URL|SPLITBOOK_NATIVE_[A-Z_]+)=' "$RUNNER_TEMP/swarm-up.log" >> "$GITHUB_ENV"

      # verify:all runs each verifier even after one fails, then prints a PASS or FAIL
      # line for each; every FAIL also becomes an annotation that names the verifier.
      - name: Run every mobile HTTP verifier, one after another
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        timeout-minutes: 20
        env:
          TZ: Asia/Kolkata
        run: |
          set +e
          pnpm mobile verify:all 2>&1 | tee "$RUNNER_TEMP/verifiers.log"
          status=$?
          set -e
          awk '/^FAIL verify:/ { print "::error title=Mobile verifier failed::" $2 " failed. Its output is in the log of this step; the backend log is the mobile-verifier-backend-log artifact." }' "$RUNNER_TEMP/verifiers.log"
          exit "$status"

      - name: Upload the backend log
        if: failure() && steps.backend.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-verifier-backend-log
          path: tools/swarm/out/backend.log
          retention-days: 7

      - name: Stop the backend and drop its database
        if: always() && steps.backend.outcome != 'skipped'
        run: pnpm swarm down --mongo-port 27017

      # #206's ratchet, last, so a pull request that raises a ceiling still shows every other
      # result before an approver labels it. It compares apps/mobile's
      # src/render-profile.ceilings.json with the base's copy (the merge commit's first parent,
      # which depth 2 already fetched). A higher ceiling, or a journey removed or renamed, fails
      # unless the pull request has the re-record-ceilings label now and the latest labeled
      # event for it on the timeline was made by an approver: the logins in the repository
      # variable CEILINGS_APPROVERS, which only an admin can set, or the repository owner alone
      # without it. The script reads the approvers and the labels, and asks GitHub, only when
      # something rose; then an empty or malformed list is refused. A docs-only pull request
      # can't change the data file, so it skips this step.
      - name: Ceilings don't rise without an approver's re-record label
        if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        shell: bash
        # Each request to GitHub gives up after 30 s; this bounds the whole step.
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          APPROVERS: ${{ vars.CEILINGS_APPROVERS || github.repository_owner }}
          # The pull request's labels as a JSON array, passed as data, never as shell text.
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error title=Ceilings not compared::PR checks expected the pull request's merge commit, so it can't find the base."
            exit 1
          fi
          base=$(git rev-parse 'HEAD^1')
          pnpm mobile ceilings:compare --base "$base" --pull-request "$PULL_REQUEST" \
            --repository "$GITHUB_REPOSITORY" --approvers "$APPROVERS" --labels-json "$LABELS"

  playwright:
    needs: nightly-gate
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true') ||
        (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci') &&
          (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
            github.event.action == 'labeled' && github.event.label.name == 'full-ci'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: apps/web

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: test
          MONGODB_URI: mongodb://127.0.0.1:27017/splitbook-build
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          AUTH_GOOGLE_ID: test
          AUTH_GOOGLE_SECRET: test

      - name: Run browser journeys (demo mode, seeded)
        run: pnpm test:e2e

      - name: Run Google OAuth journeys (google mode, intercepted redirect and ID-token sign-in)
        run: pnpm test:e2e:google

      - name: Start reproducible Linux visual-test browser
        run: |
          docker run --name splitbook-design-browser --platform linux/amd64 --rm -d --init \
            --ipc=host -p 127.0.0.1:9323:9323 \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            /bin/sh -c 'npx -y playwright@1.62.1 run-server --port 9323 --host 0.0.0.0'
          for attempt in $(seq 1 30); do
            if docker logs splitbook-design-browser 2>&1 | grep -Fq 'Listening on'; then exit 0; fi
            sleep 1
          done
          docker logs splitbook-design-browser
          exit 1

      - name: Component lab (no auth or database dependencies)
        run: pnpm test:design-system
        env:
          DESIGN_BROWSER_WS: ws://127.0.0.1:9323/

      - name: Pilot behavior, accessibility, and visual comparisons
        run: pnpm test:pilot
        env:
          DESIGN_BROWSER_WS: ws://127.0.0.1:9323/

      - name: Production lab exclusion
        run: pnpm test:production-ui

      - name: Stop visual-test browser
        if: always()
        run: docker stop splitbook-design-browser

      - name: Upload Playwright report and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright*/report/
            apps/web/playwright*/results/
            apps/web/playwright*/artifacts/
            apps/web/output/playwright/
          retention-days: 7
