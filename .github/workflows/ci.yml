name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test (unit + integration)
        run: pnpm test
        env:
          # Integration suites derive per-file splitbook-test-* databases from
          # this base URI; the demo database is never touched.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: test
          MONGODB_URI: mongodb://127.0.0.1:27017/splitbook-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_GOOGLE_ID: test
          AUTH_GOOGLE_SECRET: test

  playwright:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: test
          MONGODB_URI: mongodb://127.0.0.1:27017/splitbook-build
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          AUTH_GOOGLE_ID: test
          AUTH_GOOGLE_SECRET: test

      - name: Run browser journeys (demo mode, seeded)
        run: pnpm test:e2e

      - name: Run Google OAuth journeys (google mode, local OIDC)
        run: pnpm test:e2e:google

      - name: Upload Playwright report and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright/report/
            playwright/artifacts/
            playwright/results/
            playwright-google/report/
            playwright-google/results/
          retention-days: 7
